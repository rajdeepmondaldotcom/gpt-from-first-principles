[project]
name = "gpt-from-first-principles"
version = "0.1.0"
description = "Build a GPT yourself. Train it, serve it, then teach the same code chess."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# numpy: torch warns on every import without it
dependencies = ["torch>=2.6", "numpy"]

[project.optional-dependencies]
reference = [
    "tiktoken",
    "regex",
    # Lesson 37: Apple's engine, which exists for Macs
    "mlx-lm; sys_platform == 'darwin'",
]
# Lessons 38 to 40 and 45: the rules of chess (GPL-3) and a reader for Lichess's compressed files.
# Lesson 44: a reader for the format Lichess publishes its games in on Hugging Face.
chess = [
    "chess",
    "zstandard",
    "pyarrow",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["reference: checks our code against an outside reference; needs the reference extra"]
addopts = "-m 'not reference'"  # run those with: uv run --extra reference pytest -m reference

[tool.ruff]
line-length = 100

# On Linux, take the CPU build of torch: the default one adds gigabytes of GPU libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
